<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinWallet Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --danger: #DC2626;
            --danger-hover: #B91C1C;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .navbar h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #4F46E5, #EC4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            display: grid;
            gap: 2rem;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-actions h2 { margin: 0; font-size: 1.25rem; color: var(--text-main); }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
            display: inline-flex;
            gap: 0.5rem;
            align-items: center;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.4); }
        .btn:active { transform: translateY(0); }
        .btn.danger { background: var(--danger); box-shadow: 0 2px 4px rgba(220, 38, 38, 0.3); }
        .btn.danger:hover { background: var(--danger-hover); box-shadow: 0 4px 6px rgba(220, 38, 38, 0.4); }
        
        /* Action buttons for table rows */
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.75rem; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); box-shadow: none; }
        .btn-outline:hover { background: var(--bg-color); color: var(--text-main); }

        .section-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: var(--bg-color); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 0.75rem 1rem; font-weight: 600; }
        th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
        tbody tr:hover { background-color: #F9FAFB; }
        
        .action-cell { display: flex; gap: 0.5rem; justify-content: flex-end; }

        .badge { background: #E0E7FF; color: #3730A3; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }

        .loading, .error-msg, .empty-msg { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.875rem; }
        .error-msg { color: #DC2626; background: #FEE2E2; border-radius: 8px; margin-top: 1rem; }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: var(--surface);
            border-radius: 16px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .modal h3 { margin-top: 0; margin-bottom: 1.5rem; font-size: 1.25rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main); }
        .form-control {
            width: 100%; padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; }

    </style>
</head>
<body>

    <nav class="navbar">
        <h1>FinWallet API Dashboard</h1>
        <div class="text-sm" style="color: var(--text-muted); font-size: 0.875rem;">
            Powered by Thymeleaf & Vanilla JS
        </div>
    </nav>

    <div class="container">
        <!-- Employees Section -->
        <div class="section-card">
            <div class="header-actions">
                <h2>Employees Directory</h2>
                <div>
                    <button class="btn btn-outline" onclick="fetchEmployees()" style="margin-right: 0.5rem;">↻ Refresh</button>
                    <button class="btn" onclick="openEmployeeModal()">+ Add Employee</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Email</th><th>Department</th><th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-tbody"></tbody>
                </table>
            </div>
        </div>

        <!-- Departments Section -->
        <div class="section-card">
            <div class="header-actions">
                <h2>Departments Directory</h2>
                <div>
                    <button class="btn btn-outline" onclick="fetchDepartments()" style="margin-right: 0.5rem;">↻ Refresh</button>
                    <button class="btn" onclick="openDepartmentModal()">+ Add Department</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th><th>Name</th><th>Location</th><th style="text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="department-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Employee Modal -->
    <div class="modal-overlay" id="employee-modal">
        <div class="modal">
            <h3 id="employee-modal-title">Add Employee</h3>
            <form id="employee-form" onsubmit="saveEmployee(event)">
                <input type="hidden" id="emp-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="emp-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="emp-email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <select id="emp-dept" class="form-control">
                        <option value="">None</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('employee-modal')">Cancel</button>
                    <button type="submit" class="btn">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Department Modal -->
    <div class="modal-overlay" id="department-modal">
        <div class="modal">
            <h3 id="department-modal-title">Add Department</h3>
            <form id="department-form" onsubmit="saveDepartment(event)">
                <input type="hidden" id="dept-id">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="dept-name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="dept-location" class="form-control" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('department-modal')">Cancel</button>
                    <button type="submit" class="btn">Save Department</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let departmentsList = [];

        // Utilities
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }

        // --------- DEPARTMENTS ---------
        function fetchDepartments() {
            fetch('/department')
                .then(res => res.json())
                .then(data => {
                    departmentsList = data || [];
                    renderDepartments(departmentsList);
                    updateDepartmentDropdown(departmentsList);
                }).catch(err => alert("Error fetching departments"));
        }

        function renderDepartments(data) {
            const tbody = document.getElementById('department-tbody');
            if (!data.length) return tbody.innerHTML = `<tr><td colspan="4"><div class="empty-msg">No departments found.</div></td></tr>`;
            tbody.innerHTML = data.map(dept => `
                <tr>
                    <td><strong>#${dept.id}</strong></td>
                    <td>${dept.name}</td>
                    <td>${dept.location}</td>
                    <td>
                        <div class="action-cell">
                            <button class="btn btn-sm btn-outline" onclick="openDepartmentModal(${dept.id}, '${dept.name}', '${dept.location}')">Edit</button>
                            <button class="btn btn-sm danger" onclick="deleteDepartment(${dept.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function updateDepartmentDropdown(data) {
            const select = document.getElementById('emp-dept');
            select.innerHTML = '<option value="">None</option>' + 
                data.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        }

        function openDepartmentModal(id = '', name = '', location = '') {
            document.getElementById('dept-id').value = id;
            document.getElementById('dept-name').value = name;
            document.getElementById('dept-location').value = location;
            document.getElementById('department-modal-title').innerText = id ? 'Edit Department' : 'Add Department';
            openModal('department-modal');
        }

        function saveDepartment(e) {
            e.preventDefault();
            const id = document.getElementById('dept-id').value;
            const payload = {
                name: document.getElementById('dept-name').value,
                location: document.getElementById('dept-location').value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/department/${id}` : `/department`;

            fetch(url, {
                method, headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                closeModal('department-modal');
                fetchDepartments();
                fetchEmployees(); // Refresh employees in case department names changed
            }).catch(err => alert("Error saving department"));
        }

        function deleteDepartment(id) {
            if(!confirm("Are you sure? This deletes the department and all its employees!")) return;
            fetch(`/department/${id}`, { method: 'DELETE' })
                .then(() => { fetchDepartments(); fetchEmployees(); })
                .catch(err => alert("Error deleting department"));
        }

        // --------- EMPLOYEES ---------
        function fetchEmployees() {
            fetch('/employee')
                .then(res => res.json())
                .then(apiResponse => {
                    const data = apiResponse?.data?.content || [];
                    renderEmployees(data);
                }).catch(err => alert("Error fetching employees"));
        }

        function renderEmployees(data) {
            const tbody = document.getElementById('employee-tbody');
            if (!data.length) return tbody.innerHTML = `<tr><td colspan="5"><div class="empty-msg">No employees found.</div></td></tr>`;
            
            tbody.innerHTML = data.map(emp => {
                const deptId = emp.department ? emp.department.id : '';
                return `
                <tr>
                    <td><strong>#${emp.id}</strong></td>
                    <td>${emp.name}</td>
                    <td>${emp.email}</td>
                    <td>${emp.department ? `<span class="badge">${emp.department.name}</span>` : `<span style="color:#9CA3AF; font-size:0.75rem;">None</span>`}</td>
                    <td>
                        <div class="action-cell">
                            <button class="btn btn-sm btn-outline" onclick="openEmployeeModal(${emp.id}, '${emp.name}', '${emp.email}', '${deptId}')">Edit</button>
                            <button class="btn btn-sm danger" onclick="deleteEmployee(${emp.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `}).join('');
        }

        function openEmployeeModal(id = '', name = '', email = '', deptId = '') {
            document.getElementById('emp-id').value = id;
            document.getElementById('emp-name').value = name;
            document.getElementById('emp-email').value = email;
            document.getElementById('emp-dept').value = deptId;
            document.getElementById('employee-modal-title').innerText = id ? 'Edit Employee' : 'Add Employee';
            openModal('employee-modal');
        }

        function saveEmployee(e) {
            e.preventDefault();
            const id = document.getElementById('emp-id').value;
            const deptId = document.getElementById('emp-dept').value;
            
            const payload = {
                name: document.getElementById('emp-name').value,
                email: document.getElementById('emp-email').value,
                departmentId: deptId ? parseInt(deptId) : null
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/employee/${id}` : `/employee`;

            fetch(url, {
                method, headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                closeModal('employee-modal');
                fetchEmployees();
            }).catch(err => alert("Error saving employee"));
        }

        function deleteEmployee(id) {
            if(!confirm("Are you sure you want to delete this employee?")) return;
            fetch(`/employee/${id}`, { method: 'DELETE' })
                .then(() => fetchEmployees())
                .catch(err => alert("Error deleting employee"));
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchDepartments(); // Also populates the dropdown
            fetchEmployees();
        });
    </script>
</body>
</html>
