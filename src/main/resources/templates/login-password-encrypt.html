<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FinWallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .section-card {
            background: var(--surface); border-radius: 16px; padding: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            width: 100%; max-width: 400px;
        }

        .btn {
            background: var(--primary); color: white; border: none;
            padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 500; font-size: 0.875rem;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3);
            width: 100%; margin-top: 1rem;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.4); }

        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text-main); }
        .form-control {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px;
            font-size: 0.875rem; box-sizing: border-box; font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        .error-msg { color: #DC2626; background: #FEE2E2; border-radius: 8px; padding: 0.5rem; font-size: 0.875rem; display: none; margin-bottom: 1rem; text-align: center; }

        .auth-tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
        .auth-tab { flex: 1; padding: 1rem; cursor: pointer; font-weight: 600; color: var(--text-muted); transition: color 0.2s; text-align: center; }
        .auth-tab.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        
        .brand { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #4F46E5, #EC4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <div class="section-card">
        <div class="brand">FinWallet</div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Login</div>
            <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Register</div>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="auth-email" class="form-control" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" class="form-control" required placeholder="••••••••">
            </div>
            <div id="auth-error" class="error-msg"></div>
            <button type="submit" class="btn" id="auth-submit-btn">Login</button>
        </form>
    </div>

    <script>
        let currentAuthMode = 'login';
        
        function switchAuthTab(mode) {
            currentAuthMode = mode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'Login' : 'Register';
            document.getElementById('auth-error').style.display = 'none';
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            
            if (currentAuthMode === 'register') {
                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                }).then(async res => {
                    if (res.ok) {
                        alert("Registration successful! Please login.");
                        switchAuthTab('login');
                        document.getElementById('auth-password').value = '';
                    } else {
                        const err = await res.json();
                        showAuthError(err.message || 'Registration failed');
                    }
                }).catch(() => showAuthError("Network error during registration"));
            } else {
                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                }).then(async res => {
                    if (res.ok) {
                        const data = await res.json();
                        // Save the JWT Token
                        localStorage.setItem('jwtToken', data.token);
                        // Redirect to the dashboard upon successful login
                        window.location.href = '/ui';
                    } else {
                        showAuthError("Invalid email or password");
                    }
                }).catch(() => showAuthError("Network error during login"));
            }
        }

        function showAuthError(msg) {
            const errDiv = document.getElementById('auth-error');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }
    </script>
</body>
</html>
