services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: finwallet_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Ramesh2026@
      MYSQL_DATABASE: finwallet_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRamesh2026@"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FinWallet Spring Boot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finwallet_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/finwallet_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Ramesh2026@
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
